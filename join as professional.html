<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LocalConnect | Join as Service Provider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #D6E4FF 0%, #84A9FF 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .registration-container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(245, 249, 255, 0.98);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(26, 46, 85, 0.35);
            position: relative;
            backdrop-filter: blur(2px);
            transition: transform 0.3s ease;
        }

        .registration-container:hover {
            transform: translateY(-5px);
        }

        .close-dashboard-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFD700;
            color: #1A2E55;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 110;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-dashboard-btn:hover {
            background: #ffc107;
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .hero-gradient {
            background: linear-gradient(135deg, #3366FF 0%, #1A2E55 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }

        .hero-gradient h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero-gradient p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-content {
            padding: 35px 30px;
        }

        .info-image {
            width: 100%;
            border-radius: 20px;
            object-fit: cover;
            height: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .info-image:hover {
            transform: scale(1.02);
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D6E4FF;
            border-radius: 14px;
            transition: all 0.2s;
            background: white;
        }

        .form-control-custom:focus {
            border-color: #3366FF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.2);
        }

        .form-label {
            font-weight: 600;
            color: #1A2E55;
            margin-bottom: 6px;
            display: block;
        }

        .btn-submit {
            background: linear-gradient(95deg, #3366FF, #1A2E55);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 18px rgba(51, 102, 255, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(51, 102, 255, 0.4);
            background: linear-gradient(95deg, #1A2E55, #3366FF);
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
        }

        .success-message {
            background: #2ed573;
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
            display: none;
        }

        .terms-check {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
        }

        .terms-check input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { padding: 20px 15px; }
            .form-content { padding: 25px 18px; }
            .hero-gradient h1 { font-size: 1.6rem; }
        }

        .field-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .field-row > div {
            flex: 1;
            min-width: 140px;
        }
        
        /* CNIC helper hint */
        .cnic-hint {
            font-size: 11px;
            color: #4a6fa5;
            margin-top: 4px;
        }

        /* Password container with eye icon */
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #3366FF;
            background: transparent;
            z-index: 10;
        }
        .toggle-password:hover {
            color: #1A2E55;
        }
    </style>
</head>
<body>

<div class="registration-container" id="providerRegContainer">
    <button id="crossBackBtn" class="close-dashboard-btn" aria-label="Close">×</button>
    
    <div class="hero-gradient">
        <h1><i class="fas fa-user-tie"></i> Join as Professional</h1>
        <p>Become a trusted service partner and grow your business with LocalConnect</p>
    </div>

    <div class="form-content">
        <div class="row g-4">
            <div class="col-md-6">
                <img class="info-image" src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Professional registration">
                <div class="mt-3 p-3 bg-light rounded-3" style="background: #D6E4FF30 !important;">
                    <i class="fas fa-shield-alt text-primary me-2"></i>
                    <span style="font-size: 14px; color:#1A2E55;">✓ Verified Professionals | ✓ Secure Platform | ✓ Grow With Us</span>
                </div>
            </div>
            <div class="col-md-6">
                <form id="professionalJoinForm">
                    <div class="field-row">
                        <div>
                            <label class="form-label">First Name *</label>
                            <input type="text" id="proFirstName" class="form-control-custom" placeholder="Ahmed" required>
                        </div>
                        <div>
                            <label class="form-label">Last Name *</label>
                            <input type="text" id="proLastName" class="form-control-custom" placeholder="Raza" required>
                        </div>
                    </div>

                    <div class="field-row">
                        <div>
                            <label class="form-label">CNIC Number *</label>
                            <input type="text" id="proCNIC" class="form-control-custom" placeholder="12345-1234567-1" maxlength="15">
                            <div class="cnic-hint"><i class="fas fa-info-circle"></i> Format: 12345-1234567-1 (exactly 13 digits)</div>
                            <div id="cnicFieldError" class="error-message"></div>
                        </div>
                        <div>
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" id="proPhone" class="form-control-custom" placeholder="03XX-XXXXXXX" maxlength="13">
                            <div id="phoneError" class="error-message"></div>
                        </div>
                    </div>

                    <div class="field-row">
                        <div>
                            <label class="form-label">Email Address *</label>
                            <input type="email" id="proEmail" class="form-control-custom" placeholder="provider@example.com">
                            <div id="emailError" class="error-message"></div>
                        </div>
                        <div>
                            <label class="form-label">City *</label>
                            <select id="proCity" class="form-control-custom">
                                <option value="">Select City</option>
                                <option value="Sialkot">Sialkot</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-row">
                        <div>
                            <label class="form-label">Area / Locality *</label>
                            <select id="proArea" class="form-control-custom">
                                <option value="">Select Area</option>
                                <option value="Kingra">Kingra</option>
                                <option value="Pindi Bhago">Pindi Bhago</option>
                                <option value="sabzpeer">sabzpeer</option>
                                <option value="charwa">charwa</option>
                                <option value="mirza pur">mirza pur</option>
                                <option value="chobara">chobara</option>
                                <option value="merajky">merajky</option>
                                <option value="chakaraiya">chakaraiya</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Service Category *</label>
                            <select id="proServiceCat" class="form-control-custom">
                                <option value="">Select Service</option>
                                <option value="Plumber">Plumber</option>
                                <option value="Electration">Electration</option>
                                <option value="Mechanic">Mechanic</option>
                                <option value="Carpenter">Carpenter</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-row">
                        <div>
                            <label class="form-label">Experience *</label>
                            <select id="proExperience" class="form-control-custom">
                                <option value="">Select Experience</option>
                                <option value="0-1">0-1 Years</option>
                                <option value="1-3">1-3 Years</option>
                                <option value="3-5">3-5 Years</option>
                                <option value="5+">5+ Years</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Password *</label>
                            <div class="password-container">
                                <input type="password" id="proPassword" class="form-control-custom" placeholder="Create password">
                                <span class="toggle-password" onclick="togglePassword('proPassword')">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="field-row">
                        <div>
                            <label class="form-label">Confirm Password *</label>
                            <div class="password-container">
                                <input type="password" id="proConfirmPass" class="form-control-custom" placeholder="Confirm password">
                                <span class="toggle-password" onclick="togglePassword('proConfirmPass')">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Optional: Business Name</label>
                            <input type="text" id="proBusiness" class="form-control-custom" placeholder="Your brand (optional)">
                        </div>
                    </div>

                    <div class="terms-check">
                        <input type="checkbox" id="proTermsCheckbox">
                        <label for="proTermsCheckbox" style="font-weight: normal;">I agree to the <strong>Terms & Conditions</strong> and confirm that I am a legitimate service provider.</label>
                    </div>

                    <button type="submit" id="submitProBtn" class="btn-submit mt-4">
                        <i class="fas fa-paper-plane me-2"></i> Submit Application
                    </button>
                    <div id="globalSuccessMsg" class="success-message"></div>
                    <p style="text-align:center; margin-top:16px; font-size:13px; color:#4a6fa5;">
                        Already registered? 
                        <a href="provider_login.html" style="color:#3366FF; font-weight:700; text-decoration:none;">Login here →</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    console.log("=== PAGE LOADED: Eye icons added, strict CNIC formatting active ===");
    
    // ==================== PASSWORD TOGGLE FUNCTION ====================
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.nextElementSibling.querySelector('i');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    // ==================== STRICT CNIC FORMATTING (12345-1234567-1) ====================
    function formatCNICStrict(value) {
        // Remove all non-digit characters
        let digits = value.replace(/\D/g, '');
        // Limit to 13 digits (Pakistan CNIC length)
        if (digits.length > 13) digits = digits.slice(0, 13);
        
        let formatted = '';
        if (digits.length > 0) {
            // part1: first 5 digits
            formatted += digits.slice(0, 5);
            if (digits.length >= 5) {
                formatted += '-';
                // part2: next 7 digits
                formatted += digits.slice(5, 12);
                if (digits.length >= 12) {
                    formatted += '-';
                    // part3: last digit
                    formatted += digits.slice(12, 13);
                }
            }
        }
        return formatted;
    }

    // Validate CNIC according to the exact format 12345-1234567-1 (numeric parts)
    function isValidCNIC(cnic) {
        if (!cnic) return false;
        // Strict pattern: exactly 5 digits, dash, 7 digits, dash, 1 digit
        const regex = /^[0-9]{5}-[0-9]{7}-[0-9]{1}$/;
        const isValidFormat = regex.test(cnic);
        // Additionally, ensure total numeric length is 13
        const digitsOnly = cnic.replace(/-/g, '');
        const hasCorrectLength = digitsOnly.length === 13 && /^\d+$/.test(digitsOnly);
        return isValidFormat && hasCorrectLength;
    }

    // Phone validation: format 03XX-XXXXXXX
    function isValidPhone(phone) {
        const regex = /^03[0-9]{2}-[0-9]{7}$/;
        return regex.test(phone);
    }

    function isValidEmail(email) {
        const re = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        return re.test(email);
    }

    function clearErrors() {
        const cnicErr = document.getElementById('cnicFieldError');
        const phoneErr = document.getElementById('phoneError');
        const emailErr = document.getElementById('emailError');
        const globalMsg = document.getElementById('globalSuccessMsg');
        if (cnicErr) cnicErr.innerText = '';
        if (phoneErr) phoneErr.innerText = '';
        if (emailErr) emailErr.innerText = '';
        if (globalMsg) {
            globalMsg.style.display = 'none';
            globalMsg.innerText = '';
        }
    }

    function showError(elementId, message) {
        const errorDiv = document.getElementById(elementId);
        if (errorDiv) errorDiv.innerText = message;
    }

    // ==================== CNIC INPUT EVENT (strict formatting enforced in real time) ====================
    const cnicInput = document.getElementById('proCNIC');
    if (cnicInput) {
        cnicInput.addEventListener('input', function(e) {
            let rawValue = e.target.value;
            // Apply strict formatting based on digits only
            let formatted = formatCNICStrict(rawValue);
            // To prevent cursor jumps, we update value only if different
            if (e.target.value !== formatted) {
                e.target.value = formatted;
            }
            // Clear any previous CNIC error on typing
            const cnicErr = document.getElementById('cnicFieldError');
            if (cnicErr) cnicErr.innerText = '';
        });
        
        // Additional blur handler: make sure partial incomplete entries are not left in weird state
        cnicInput.addEventListener('blur', function(e) {
            let current = e.target.value;
            if (current && (current.endsWith('-') && (current.match(/-/g) || []).length === 1 && current.split('-')[1]?.length === 0)) {
                e.target.value = current.slice(0, -1);
            }
            if (current && (current.match(/-/g) || []).length === 2 && current.endsWith('-')) {
                e.target.value = current.slice(0, -1);
            }
            let digitsOnly = current.replace(/\D/g, '');
            if (digitsOnly.length === 13 && !isValidCNIC(current)) {
                let corrected = `${digitsOnly.slice(0,5)}-${digitsOnly.slice(5,12)}-${digitsOnly.slice(12,13)}`;
                e.target.value = corrected;
            }
        });
    }

    // Phone formatting (03XX-XXXXXXX)
    const phoneInput = document.getElementById('proPhone');
    if (phoneInput) {
        phoneInput.addEventListener('input', function(e) {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length > 4) {
                val = val.slice(0,4) + '-' + val.slice(4, 11);
            } else if (val.length > 0) {
                val = val;
            }
            if (val.length > 13) val = val.slice(0,13);
            e.target.value = val;
        });
    }

    // ==================== FORM SUBMISSION ====================
    const form = document.getElementById('professionalJoinForm');
    if (form) {
        form.addEventListener('submit', function(event) {
            console.log("=== FORM SUBMIT TRIGGERED (With Eye Icons) ===");
            event.preventDefault();
            clearErrors();

            const firstName = document.getElementById('proFirstName').value.trim();
            const lastName = document.getElementById('proLastName').value.trim();
            let cnic = document.getElementById('proCNIC').value.trim();
            const phone = document.getElementById('proPhone').value.trim();
            const email = document.getElementById('proEmail').value.trim();
            const city = document.getElementById('proCity').value;
            const area = document.getElementById('proArea').value;
            const serviceCategory = document.getElementById('proServiceCat').value;
            const experience = document.getElementById('proExperience').value;
            const password = document.getElementById('proPassword').value;
            const confirmPass = document.getElementById('proConfirmPass').value;
            const businessName = document.getElementById('proBusiness').value.trim();
            const termsAccepted = document.getElementById('proTermsCheckbox').checked;

            // Additional CNIC robust cleanup
            if (cnic && !cnic.includes('-')) {
                let digitsOnly = cnic.replace(/\D/g, '');
                if (digitsOnly.length === 13) {
                    cnic = `${digitsOnly.slice(0,5)}-${digitsOnly.slice(5,12)}-${digitsOnly.slice(12,13)}`;
                    document.getElementById('proCNIC').value = cnic;
                } else {
                    let fixedAttempt = formatCNICStrict(digitsOnly);
                    if (fixedAttempt.length >= 15 && fixedAttempt.includes('-')) {
                        cnic = fixedAttempt;
                        document.getElementById('proCNIC').value = cnic;
                    }
                }
            } else if (cnic && cnic.includes('-')) {
                let parts = cnic.split('-');
                if (parts.length === 3) {
                    let p1 = parts[0].replace(/\D/g, '').slice(0,5);
                    let p2 = parts[1].replace(/\D/g, '').slice(0,7);
                    let p3 = parts[2].replace(/\D/g, '').slice(0,1);
                    let combined = p1 + p2 + p3;
                    if (combined.length === 13) {
                        let newCnic = `${p1}-${p2}-${p3}`;
                        if (newCnic !== cnic) {
                            cnic = newCnic;
                            document.getElementById('proCNIC').value = cnic;
                        }
                    }
                }
            }
            
            console.log("Validation: First Name:", firstName, "CNIC final:", cnic, "Phone:", phone);
            
            if (!firstName || !lastName) {
                alert('Please enter your full name');
                return;
            }
            if (!isValidCNIC(cnic)) {
                showError('cnicFieldError', 'Invalid CNIC! Must follow format: 12345-1234567-1 (exactly 13 digits, e.g., 12345-1234567-1)');
                return;
            }
            if (!phone) {
                showError('phoneError', 'Phone number is required');
                return;
            }
            if (!isValidPhone(phone)) {
                showError('phoneError', 'Phone must be like 03XX-XXXXXXX (e.g., 0312-3456789)');
                return;
            }
            if (!email) {
                showError('emailError', 'Email is required');
                return;
            }
            if (!isValidEmail(email)) {
                showError('emailError', 'Enter a valid email address');
                return;
            }
            if (!city) {
                alert('Please select your city');
                return;
            }
            if (!area) {
                alert('Please select your area/locality');
                return;
            }
            if (!serviceCategory) {
                alert('Please select your service category');
                return;
            }
            if (!experience) {
                alert('Please select your experience level');
                return;
            }
            if (!password) {
                alert('Please create a password');
                return;
            }
            if (password !== confirmPass) {
                alert('Passwords do not match');
                return;
            }
            if (password.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            if (!termsAccepted) {
                alert('You must agree to the Terms & Conditions');
                return;
            }

            console.log("All validations passed. Sending to backend...");
            
            fetch("register_provider.php", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    password: password,
                    phone: phone,
                    city: city,
                    area: area,
                    service: serviceCategory,
                    experience: experience,
                    businessName: businessName,
                    cnic: cnic
                })
            })
            .then(res => res.text())
            .then(data => {
                console.log("Server Response:", data);
                
                if (data.trim() === "success") {
                    const successDiv = document.getElementById('globalSuccessMsg');
                    successDiv.style.background = '#2ed573';
                    successDiv.innerHTML = '✅ Application Submitted Successfully!<br><small style="font-weight:400;">Your request has been sent to admin for approval. You will be able to login once approved.</small>';
                    successDiv.style.display = 'block';
                    successDiv.style.borderRadius = '14px';
                    successDiv.style.padding = '16px';

                    // Disable submit button
                    document.getElementById('submitProBtn').disabled = true;

                    setTimeout(() => {
                        window.location.href = 'provider_login.html';
                    }, 3500);

                } else if (data.trim() === "email_exists") {
                    alert('⚠️ Email already registered! Please login or use a different email.');
                } else {
                    alert('Registration failed: ' + data);
                }
            })
            .catch(err => {
                console.error("Fetch Error:", err);
                alert('Network error. Please try again. Ensure backend server is running.');
            });
        });
    } else {
        console.log("ERROR: Form not found!");
    }

    // ==================== CROSS BUTTON ====================
    const crossBtn = document.getElementById('crossBackBtn');
    if (crossBtn) {
        crossBtn.addEventListener('click', function() {
            window.location.href = 'dashboard_new_connected.php';
        });
    }

    // Pre-run: ensure CNIC field initial value formatting
    document.addEventListener('DOMContentLoaded', function() {
        if (cnicInput && cnicInput.value) {
            let raw = cnicInput.value;
            let digitsOnly = raw.replace(/\D/g, '');
            if (digitsOnly.length === 13 && !isValidCNIC(raw)) {
                let formatted = `${digitsOnly.slice(0,5)}-${digitsOnly.slice(5,12)}-${digitsOnly.slice(12,13)}`;
                cnicInput.value = formatted;
            } else if (digitsOnly.length > 0 && digitsOnly.length < 13) {
                let formatted = formatCNICStrict(raw);
                if (formatted !== raw) cnicInput.value = formatted;
            }
        }
        console.log("DOM fully loaded: Eye icons present, CNIC strict formatter active.");
    });
</script>
</body>
</html>
