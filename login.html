<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalConnect | Service Provider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #D6E4FF 0%, #84A9FF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }
        
        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background-color: #F5F9FF;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(26, 46, 85, 0.2);
            animation: fadeIn 1s ease-out;
        }
        
        .image-section {
            flex: 1;
            background: 
                linear-gradient(rgba(26, 46, 85, 0.7), rgba(51, 102, 255, 0.7)),
                url('https://images.unsplash.com/photo-1556761175-5973dc0f32e7?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60') center/cover;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 46, 85, 0.6);
            z-index: 1;
        }
        
        .image-content {
            position: relative;
            z-index: 2;
        }
        
        .image-section h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: slideInFromLeft 1s ease-out;
            color: #F5F9FF;
        }
        
        .image-section p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #D6E4FF;
        }
        
        .features {
            text-align: left;
            margin-top: 20px;
        }
        
        .features p {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            color: #D6E4FF;
        }
        
        .features i {
            margin-right: 10px;
            color: #84A9FF;
        }
        
        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .form-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .form-title {
            font-size: 2rem;
            color: #1A2E55;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .form-subtitle {
            color: #3366FF;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1A2E55;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D6E4FF;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #F5F9FF;
        }
        
        .form-control:focus {
            border-color: #3366FF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.2);
        }
        
        /* FIXED: Single eye icon styling */
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #3366FF;
            z-index: 10;
            background: #F5F9FF;
            padding: 5px;
            border-radius: 4px;
        }
        
        .toggle-password:hover {
            background: #D6E4FF;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #3366FF;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #1A2E55;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(26, 46, 85, 0.2);
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #3366FF;
        }
        
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #D6E4FF;
        }
        
        .divider span {
            background-color: #F5F9FF;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #D6E4FF;
            border-radius: 8px;
            background-color: #F5F9FF;
            color: #1A2E55;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .social-btn:hover {
            border-color: #3366FF;
            transform: translateY(-3px);
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 25px;
            color: #1A2E55;
        }
        
        .toggle-form a {
            color: #3366FF;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .toggle-form a:hover {
            color: #1A2E55;
            text-decoration: underline;
        }
        
        .form-page {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        
        .active {
            display: block;
        }
        
        .password-hint {
            font-size: 0.8rem;
            color: #3366FF;
            margin-top: 5px;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: 5px;
        }
        
        .forgot-password a {
            color: #3366FF;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .forgot-password a:hover {
            color: #1A2E55;
            text-decoration: underline;
        }
        
        .email-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #D6E4FF;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(26, 46, 85, 0.1);
            display: none;
        }
        
        .email-suggestion {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .email-suggestion:hover {
            background-color: #D6E4FF;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInFromLeft {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInFromRight {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .login-container {
            border: 3px solid #D6E4FF;
            border-radius: 15px;
            padding: 30px;
            animation: slideInFromRight 1s ease-out;
            background-color: #F5F9FF;
        }
        
        /* REMOVED: Password strength indicator styles */
        
        .error-message {
            color: #ff4757;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #2ed573;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
        
        /* Validation feedback */
        .validation-error {
            border-color: #ff4757 !important;
        }
        
        .validation-success {
            border-color: #2ed573 !important;
        }
        
        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .image-section {
                padding: 30px 20px;
            }
            
            .form-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <div class="image-overlay"></div>
            <div class="image-content">
                <h1>Local Service Provider</h1>
                <p>Finding Help Should Be Easy — We Make It Happen.</p>
            </div>
        </div>
        
        <div class="form-section">
            <div class="login-container">
                <!-- Login Form -->
                <div id="login-form" class="form-page active">
                    <h2 class="form-title">Welcome to LSP</h2>
                    <p class="form-subtitle">Sign in to your account</p>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
                            <div id="email-suggestions" class="email-suggestions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <div class="password-container">
                                <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                                <span class="toggle-password" id="toggleLoginPassword">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                            <div id="login-error" class="error-message"></div>
                            <div class="forgot-password">
                                <a href="#" id="forgot-password-link">Forgot Password?</a>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </div>
                    </form>
                    
                    <div class="divider"><span>or continue with</span></div>
                    
                    <div class="social-login">
                        <button class="social-btn">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button class="social-btn">
                            <i class="fab fa-facebook-f"></i> Facebook
                        </button>
                    </div>
                    
                    <div class="toggle-form">
                        Don't have an account? <a href="#" id="show-signup">Sign Up</a>
                    </div>
                </div>
                
                <!-- Signup Form (Password requirements removed) -->
                <div id="signup-form" class="form-page">
                    <h2 class="form-title">Create Account</h2>
                    <p class="form-subtitle">Join our community of service providers</p>
                    
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" class="form-control" placeholder="Enter your first name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" class="form-control" placeholder="Enter your last name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="signup-email">Email Address</label>
                            <input type="email" id="signup-email" class="form-control" placeholder="Enter your email" required>
                            <div id="email-error" class="error-message"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="services">Select Service</label>
                            <select id="services" class="form-control" required>
                                <option value="" disabled selected>Select your service</option>
                                <option value="plumbing">Plumbing</option>
                                <option value="electrical">Electrical</option>
                                <option value="carpanter">carpanter</option>
                                <option value="mechanic">Mechanic</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <div class="password-container">
                                <input type="password" id="signup-password" class="form-control" placeholder="Create a password" required>
                                <span class="toggle-password" id="toggleSignupPassword">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                            <div id="password-error" class="error-message"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <div class="password-container">
                                <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required>
                                <span class="toggle-password" id="toggleConfirmPassword">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                            <div id="confirm-error" class="error-message"></div>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" id="signup-btn" class="btn btn-primary signup-btn" disabled>Create Account</button>
                        </div>
                    </form>
                    
                    <div class="toggle-form">
                        Already have an account? <a href="#" id="show-login">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Email storage and autocomplete functionality
        const EMAIL_STORAGE_KEY = 'localConnectEmails';
        const PASSWORD_STORAGE_KEY = 'localConnectPasswords';
        const USERS_STORAGE_KEY = 'localConnectUsers';
        
        // Get stored emails from localStorage
        function getStoredEmails() {
            const stored = localStorage.getItem(EMAIL_STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }
        
        // Get stored passwords from localStorage
        function getStoredPasswords() {
            const stored = localStorage.getItem(PASSWORD_STORAGE_KEY);
            return stored ? JSON.parse(stored) : {};
        }
        
        // Get stored users from localStorage
        function getStoredUsers() {
            const stored = localStorage.getItem(USERS_STORAGE_KEY);
            return stored ? JSON.parse(stored) : {};
        }
        
        // Save email to localStorage
        function saveEmail(email) {
            if (!email) return;
            
            const emails = getStoredEmails();
            
            // Check if email already exists
            if (!emails.includes(email)) {
                emails.push(email);
                
                // Keep only the last 10 emails
                if (emails.length > 10) {
                    emails.shift();
                }
                
                localStorage.setItem(EMAIL_STORAGE_KEY, JSON.stringify(emails));
            }
        }
        
        // Save user with hashed password
        function saveUser(userData, password) {
            const users = getStoredUsers();
            const passwords = getStoredPasswords();
            
            // Simple hash function for demo (not for production)
            function simpleHash(password) {
                let hash = 0;
                for (let i = 0; i < password.length; i++) {
                    const char = password.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString();
            }
            
            users[userData.email] = userData;
            passwords[userData.email] = simpleHash(password);
            
            localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
            localStorage.setItem(PASSWORD_STORAGE_KEY, JSON.stringify(passwords));
            saveEmail(userData.email);
        }
        
        // Verify password
        function verifyPassword(email, password) {
            const passwords = getStoredPasswords();
            
            function simpleHash(password) {
                let hash = 0;
                for (let i = 0; i < password.length; i++) {
                    const char = password.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString();
            }
            
            const hashedPassword = simpleHash(password);
            return passwords[email] === hashedPassword;
        }
        
        // Check if user exists
        function userExists(email) {
            const users = getStoredUsers();
            return users.hasOwnProperty(email);
        }
        
        // Show email suggestions
        function showEmailSuggestions(inputElement, suggestionsContainer) {
            const emails = getStoredEmails();
            const currentValue = inputElement.value;
            
            if (emails.length === 0 || currentValue.length < 1) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            // Filter emails that start with the current input
            const matchingEmails = emails.filter(email => 
                email.toLowerCase().startsWith(currentValue.toLowerCase())
            );
            
            if (matchingEmails.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            // Create suggestion elements
            suggestionsContainer.innerHTML = '';
            matchingEmails.forEach(email => {
                const div = document.createElement('div');
                div.className = 'email-suggestion';
                div.textContent = email;
                div.addEventListener('click', () => {
                    inputElement.value = email;
                    suggestionsContainer.style.display = 'none';
                    inputElement.focus();
                });
                suggestionsContainer.appendChild(div);
            });
            
            suggestionsContainer.style.display = 'block';
        }
        
        // Toggle between login and signup forms
        document.getElementById('show-signup').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('signup-form').classList.add('active');
            resetSignupForm();
        });
        
        document.getElementById('show-login').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('signup-form').classList.remove('active');
            document.getElementById('login-form').classList.add('active');
            resetLoginForm();
        });
        
        // FIXED: Single password toggle function with proper icon management
        function setupPasswordToggle(toggleId, passwordId) {
            const toggle = document.getElementById(toggleId);
            const password = document.getElementById(passwordId);
            
            toggle.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                // Toggle eye icon
                const icon = toggle.querySelector('i');
                if (type === 'password') {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        }
        
        // Set up password toggles
        setupPasswordToggle('toggleLoginPassword', 'login-password');
        setupPasswordToggle('toggleSignupPassword', 'signup-password');
        setupPasswordToggle('toggleConfirmPassword', 'confirm-password');
        
        // Set up email autocomplete
        const loginEmailInput = document.getElementById('login-email');
        const emailSuggestions = document.getElementById('email-suggestions');
        
        if (loginEmailInput && emailSuggestions) {
            loginEmailInput.addEventListener('input', function() {
                showEmailSuggestions(this, emailSuggestions);
            });
            
            loginEmailInput.addEventListener('focus', function() {
                showEmailSuggestions(this, emailSuggestions);
            });
            
            // Hide suggestions when clicking outside
            document.addEventListener('click', function(e) {
                if (!loginEmailInput.contains(e.target) && !emailSuggestions.contains(e.target)) {
                    emailSuggestions.style.display = 'none';
                }
            });
        }
        
        // Reset signup form
        function resetSignupForm() {
            document.getElementById('signup-btn').disabled = true;
            document.getElementById('password-error').style.display = 'none';
            document.getElementById('confirm-error').style.display = 'none';
        }
        
        // Reset login form
        function resetLoginForm() {
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-email').classList.remove('validation-error', 'validation-success');
            document.getElementById('login-password').classList.remove('validation-error', 'validation-success');
        }
        
        // Helper: Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // Real-time password validation (only checks non-empty and match)
        document.getElementById('signup-password').addEventListener('input', function() {
            const password = this.value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const passwordError = document.getElementById('password-error');
            const confirmError = document.getElementById('confirm-error');
            const signupBtn = document.getElementById('signup-btn');
            
            // No complex requirements - just check if password is not empty
            if (password && password.length > 0) {
                passwordError.style.display = 'none';
                this.classList.remove('validation-error');
                this.classList.add('validation-success');
            } else {
                passwordError.style.display = 'none';
                this.classList.remove('validation-error', 'validation-success');
            }
            
            // Check if passwords match
            if (confirmPassword && password !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match';
                confirmError.style.display = 'block';
                document.getElementById('confirm-password').classList.add('validation-error');
                document.getElementById('confirm-password').classList.remove('validation-success');
            } else if (confirmPassword && password === confirmPassword) {
                confirmError.style.display = 'none';
                document.getElementById('confirm-password').classList.remove('validation-error');
                document.getElementById('confirm-password').classList.add('validation-success');
            } else {
                confirmError.style.display = 'none';
                document.getElementById('confirm-password').classList.remove('validation-error', 'validation-success');
            }
            
            // Enable/disable signup button based on basic validation (all fields filled, email valid, passwords match and non-empty)
            const email = document.getElementById('signup-email').value;
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const dob = document.getElementById('dob').value;
            const service = document.getElementById('services').value;
            
            const isFormValid = email && firstName && lastName && dob && service && 
                               password && confirmPassword && 
                               password === confirmPassword && isValidEmail(email);
            
            signupBtn.disabled = !isFormValid;
        });
        
        // Real-time confirm password validation
        document.getElementById('confirm-password').addEventListener('input', function() {
            const password = document.getElementById('signup-password').value;
            const confirmPassword = this.value;
            const confirmError = document.getElementById('confirm-error');
            const signupBtn = document.getElementById('signup-btn');
            
            if (password && confirmPassword && password !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match';
                confirmError.style.display = 'block';
                this.classList.add('validation-error');
                this.classList.remove('validation-success');
            } else if (password && confirmPassword && password === confirmPassword) {
                confirmError.style.display = 'none';
                this.classList.remove('validation-error');
                this.classList.add('validation-success');
            } else {
                confirmError.style.display = 'none';
                this.classList.remove('validation-error', 'validation-success');
            }
            
            // Check if all fields are valid for enabling signup button
            const email = document.getElementById('signup-email').value;
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const dob = document.getElementById('dob').value;
            const service = document.getElementById('services').value;
            
            const isFormValid = email && firstName && lastName && dob && service && 
                               password && confirmPassword && 
                               password === confirmPassword && isValidEmail(email);
            
            signupBtn.disabled = !isFormValid;
        });
        
        // Email validation
        document.getElementById('signup-email').addEventListener('input', function() {
            const email = this.value;
            const emailError = document.getElementById('email-error');
            const signupBtn = document.getElementById('signup-btn');
            
            if (email && !isValidEmail(email)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.style.display = 'block';
                this.classList.add('validation-error');
                this.classList.remove('validation-success');
            } else if (email && isValidEmail(email)) {
                emailError.style.display = 'none';
                this.classList.remove('validation-error');
                this.classList.add('validation-success');
            } else {
                emailError.style.display = 'none';
                this.classList.remove('validation-error', 'validation-success');
            }
            
            // Check if button should be enabled
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const dob = document.getElementById('dob').value;
            const service = document.getElementById('services').value;
            
            const isFormValid = email && firstName && lastName && dob && service && 
                               password && confirmPassword && 
                               password === confirmPassword && isValidEmail(email);
            
            signupBtn.disabled = !isFormValid;
        });
        
        // Login email validation
        document.getElementById('login-email').addEventListener('input', function() {
            const email = this.value;
            
            if (email && !isValidEmail(email)) {
                this.classList.add('validation-error');
                this.classList.remove('validation-success');
            } else if (email && isValidEmail(email)) {
                this.classList.remove('validation-error');
                this.classList.add('validation-success');
            } else {
                this.classList.remove('validation-error', 'validation-success');
            }
        });
        
        // Login password validation (just check non-empty)
        document.getElementById('login-password').addEventListener('input', function() {
            const password = this.value;
            
            if (password) {
                this.classList.add('validation-success');
                this.classList.remove('validation-error');
            } else {
                this.classList.remove('validation-success', 'validation-error');
            }
        });
        
        // Form validation for signup - removed password requirements, only basic validation
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Gather form data
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const dob = document.getElementById('dob').value;
            const service = document.getElementById('services').value;
            
            // Basic validation already handled by button disable, but double-check
            if (!firstName || !lastName || !email || !password || !dob || !service) {
                alert('Please fill in all fields');
                return;
            }
            
            if (!isValidEmail(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            if (password !== document.getElementById('confirm-password').value) {
                alert('Passwords do not match');
                return;
            }
            
            // Send to server
            fetch("http://localhost/local-service/register.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    password: password,
                    dob: dob,
                    service: service
                })
            })
            .then(res => res.text())
            .then(data => {
                console.log("Signup Response:", data);
                data = data.trim();
                
                if(data === "success") {
                    alert("Signup successful ✅");
                    document.getElementById('signup-form').classList.remove('active');
                    document.getElementById('login-form').classList.add('active');
                } else {
                    alert(data);
                }
            })
            .catch(err => {
                console.error('Signup error:', err);
                alert('Registration failed. Please try again.');
            });
        });
        
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }
            
            fetch("http://localhost/local-service/login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    email: email,
                    password: password
                })
            })
           .then(res => res.text())
.then(data => {
    console.log("Response:", data);

    data = data.trim();

    if (data.startsWith("success")) {

        let parts = data.split("|");

        let name = parts[1] || "User"; // agar name na aaye to default
        let email = document.getElementById("login-email").value;

        // Save in localStorage
        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);

        // Redirect to dashboard
        window.location.href = "dashboard_new.html";

    } else {
        alert(data);
    }
})
.catch(error => {
    console.error("Error:", error);
});
        });
        
        // Simple forgot password functionality
        document.getElementById('forgot-password-link').addEventListener('click', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value || prompt('Please enter your email address to reset password:');
            if (email) {
                if (!isValidEmail(email)) {
                    alert('Please enter a valid email address');
                    return;
                }
                
                const users = getStoredUsers();
                if (users[email]) {
                    alert(`Password reset instructions have been sent to ${email}.\n\nFor demo purposes: You can create a new account with this email.`);
                } else {
                    alert('Email not found. Please sign up first.');
                }
            }
        });
        
        // Initialize form validation
        document.addEventListener('DOMContentLoaded', function() {
            resetSignupForm();
            resetLoginForm();
            
            // Add input validation for other required fields (first-name, last-name, dob, services)
            const requiredFields = ['first-name', 'last-name', 'dob', 'services'];
            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field) {
                    field.addEventListener('input', function() {
                        const signupBtn = document.getElementById('signup-btn');
                        const email = document.getElementById('signup-email').value;
                        const password = document.getElementById('signup-password').value;
                        const confirmPassword = document.getElementById('confirm-password').value;
                        const firstName = document.getElementById('first-name').value;
                        const lastName = document.getElementById('last-name').value;
                        const dob = document.getElementById('dob').value;
                        const service = document.getElementById('services').value;
                        
                        const isFormValid = email && firstName && lastName && dob && service && 
                                           password && confirmPassword && 
                                           password === confirmPassword && isValidEmail(email);
                        
                        signupBtn.disabled = !isFormValid;
                        
                        // Add validation styling
                        if (this.value) {
                            this.classList.add('validation-success');
                            this.classList.remove('validation-error');
                        } else {
                            this.classList.remove('validation-success', 'validation-error');
                        }
                    });
                }
            });
        });
    </script>
